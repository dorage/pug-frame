name: Release

# PR: 버전 올림 검사(npm 패키지·Obsidian 플러그인) + 빌드 검증 + 플러그인 산출물 Artifact 업로드
# main push: 레지스트리에 없는 버전의 @pug-frame/* 패키지를 npm 에 배포(Trusted Publishing)
#            + manifest 버전이 새로 올라간 경우 Obsidian 초안 GitHub Release 생성
# x.y.z 태그 push: Obsidian 초안 GitHub Release 생성
on:
  push:
    branches:
      - main
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  # 배포 중인 main/태그 실행은 취소하지 않는다
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  version-check:
    # `no-version-bump` 라벨을 붙이면 검사를 건너뛴다(비상 탈출구)
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-version-bump')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Check version bumps
        run: bun scripts/check-version.ts origin/${{ github.base_ref }}

  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # npm 에 올리는 세 패키지. render 는 nx 가 canvas·cli 의 의존성으로 먼저 빌드한다
      - name: Build packages
        run: pnpm exec nx run-many -t build -p render,canvas,cli

      - name: Build plugin
        run: pnpm --filter pug-frame-obsidian build

      - name: Read manifest version
        id: meta
        run: echo "version=$(jq -r .version plugins/obsidian/manifest.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: pug-frame-obsidian-${{ steps.meta.outputs.version }}-${{ github.sha }}
          path: |
            plugins/obsidian/main.js
            plugins/obsidian/manifest.json
            plugins/obsidian/styles.css
          if-no-files-found: error
          retention-days: 14

  publish-npm:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Trusted Publishing: npmjs.com 의 각 패키지 설정에 이 리포·이 워크플로 파일(release.yml)이
    # 등록되어 있어야 한다. 토큰 시크릿은 쓰지 않는다
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2

      # Trusted Publishing 은 npm 11.5.1 이상이 필요하다. Node 22 에 딸린 npm 은 10.x 다
      - name: Update npm
        run: npm install -g npm@latest && npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm exec nx run-many -t build -p render,canvas,cli

      # 레지스트리에 없는 버전만 배포한다. 이미 있으면 건너뛴다
      - name: Publish packages
        run: bun scripts/publish-packages.ts

  release-obsidian:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: pug-frame-obsidian-${{ env.VERSION }}-${{ github.sha }}
          path: dist

      # 태그 push: Obsidian 은 태그와 manifest.json version 이 같아야 업데이트를 찾는다
      - name: Verify tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if [ "$tag" != "$VERSION" ]; then
            echo "::error::태그 $tag 가 manifest.json version $VERSION 과 다릅니다"
            exit 1
          fi

      # main push: 같은 버전의 릴리스(초안 포함)가 이미 있으면 만들지 않는다
      - name: Skip if release exists
        id: exists
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "release $VERSION already exists, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft release
        if: steps.exists.outputs.skip != 'true'
        run: |
          gh release create "$VERSION" \
            --draft \
            --title "$VERSION" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            dist/main.js dist/manifest.json dist/styles.css
